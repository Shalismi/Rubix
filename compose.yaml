name: rubix

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rubix
      POSTGRES_PASSWORD: rubix_local_password
      POSTGRES_USER: rubix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubix -d rubix"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  migrations:
    build:
      context: .
      target: build
    command: npm run db:migrate:deploy --prefix server
    environment:
      DATABASE_URL: postgresql://rubix:rubix_local_password@database:5432/rubix?schema=public
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      CLIENT_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://rubix:rubix_local_password@database:5432/rubix?schema=public
      NODE_ENV: production
      PORT: 5000
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    init: true
    ports:
      - "8080:5000"

volumes:
  postgres_data:
